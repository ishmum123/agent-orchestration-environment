[package]
name = "orc"
version = "0.1.0"
edition = "2021"
description = "Parallel Claude Code agents with an intelligent orchestrator"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
