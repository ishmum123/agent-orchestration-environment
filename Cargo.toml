[package]
name = "orc"
version = "0.2.0"
edition = "2021"
description = "Parallel Claude Code agents with an intelligent orchestrator"
license = "MIT"
repository = "https://github.com/ishmum123/agent-orchestration-environment"
authors = ["Ishmum Jawad Khan <ishmumkhan@yahoo.co.in>"]

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
pulldown-cmark = { version = "0.13.3", default-features = false }
unicode-width = "0.2.0"
arboard = { version = "3", default-features = false, features = ["image-data"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
